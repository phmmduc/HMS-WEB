# ----------------------------------------------------------------------------
# MediCore HMS - Application Configuration
# ----------------------------------------------------------------------------
spring.application.name=medicore-hms
server.port=8080

# ----------------------------------------------------------------------------
# Supabase PostgreSQL Database Configuration
# ----------------------------------------------------------------------------
# Host: aws-0-ap-northeast-2.pooler.supabase.com (Shared Pooler - Session mode)
# Port: 5432
# Database: postgres
# Username: postgres.abbivalfllpmdwxddnra
# ----------------------------------------------------------------------------
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SUPABASE_DB_USERNAME:postgres.abbivalfllpmdwxddnra}
spring.datasource.password=${SUPABASE_DB_PASSWORD:btlsqlnhom2}
spring.datasource.driver-class-name=org.postgresql.Driver

# ----------------------------------------------------------------------------
# Spring Data JPA & Hibernate Configuration
# ----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ----------------------------------------------------------------------------
# Thymeleaf Template Engine Configuration
# ----------------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ----------------------------------------------------------------------------
# Static Resources
# ----------------------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/
