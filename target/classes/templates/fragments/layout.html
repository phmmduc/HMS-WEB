<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="html_head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0284c7">
    <title th:text="${title != null ? title + ' | MediCore HMS' : 'MediCore HMS'}">MediCore HMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        /* Modal and dropdown helper utilities */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(4px); z-index: 50; display: none; align-items: center; justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .tab-btn.active {
            border-bottom: 2px solid #0284c7; color: #0284c7; font-weight: 700;
        }
    </style>
</head>
<body>
<div class="app-shell">
    <!-- Sidebar Fragment -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <!-- Main Workspace -->
    <div class="workspace">
        <!-- Topbar Fragment -->
        <div th:replace="~{fragments/header :: header}"></div>

        <!-- Alerts -->
        <div th:replace="~{fragments/modals :: alerts}"></div>

        <!-- Page Specific Content Body -->
        <main class="page-content">
            <div th:replace="${content}"></div>
        </main>
    </div>
</div>

<script>
    // Minimal vanilla JS for client-side UX
    document.addEventListener('DOMContentLoaded', function () {
        // Auto-dismiss toasts after 4 seconds
        setTimeout(function () {
            document.querySelectorAll('.hms-toast').forEach(function(el) {
                el.style.opacity = '0';
                el.style.transition = 'opacity 0.5s ease';
                setTimeout(function() { el.remove(); }, 500);
            });
        }, 4000);

        // Simple modal opener/closer by data attribute
        document.querySelectorAll('[data-open-modal]').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var modalId = btn.getAttribute('data-open-modal');
                var modal = document.getElementById(modalId);
                if (modal) modal.classList.add('active');
            });
        });

        document.querySelectorAll('[data-close-modal]').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var modal = btn.closest('.modal-overlay');
                if (modal) modal.classList.remove('active');
            });
        });
    });
</script>
</body>
</html>
